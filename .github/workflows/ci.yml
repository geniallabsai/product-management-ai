name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: node ./scripts/test-runner.mjs
      - run: node ./bin/pm-ai.js doctor
      - run: python -m py_compile ./python/pm_ai/repository_analyzer.py
      - run: node ./bin/pm-ai.js analyze-repo --path examples --output .pm-ai/outputs/ci-analysis.json --report .pm-ai/outputs/ci-report.md --visual .pm-ai/outputs/ci-dashboard.html
